  /* Layout concept: calm clinical layout. Wide white space, one strong blue anchor band (Why Patients Choose SmileCare),
     soft mist panels between white sections, teal used only for small health cues. */
  :root {
    --white: #FFFFFF;
    --mist: #F4F9FD;
    --brand: #1677C8;
    --brand-dark: #0F5FA6;
    --teal: #20B2AA;
    --ink: #172B4D;
    --ink-soft: #4A5D7E;
    --line: #DCE8F3;
    --font-heading: "Poppins", ui-sans-serif, system-ui, sans-serif;
    --font-body: "Inter", ui-sans-serif, system-ui, sans-serif;
  }
  html { scroll-behavior: smooth; }
  body {
    background: var(--white);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    z-index: 60; background: var(--white);
  }
  h1, h2, h3, h4 { font-family: var(--font-heading); }

    width: 100%; max-width: 1200px; margin-inline: auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  @media (min-width: 640px) {
    .wrap {
      padding-left: max(24px, env(safe-area-inset-left, 0px));
      padding-right: max(24px, env(safe-area-inset-right, 0px));
    }
  }
  header.site { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; }
  section[id] { scroll-margin-top: calc(76px + env(safe-area-inset-top, 0px)); }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; border-radius: 8px; }

  /* entrance animations: transform-only reveal keeps content visible at rest */
  .rv { transition: transform .65s cubic-bezier(.2,.7,.2,1); }
  .rv.rv-pre { transform: translateY(18px); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }

  /* hamburger */
  .burger { position: relative; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--white); }
  .burger span { position: absolute; left: 12px; right: 12px; height: 2px; border-radius: 2px; background: var(--ink);
    transition: transform .3s ease, opacity .2s ease, top .3s ease; }
  .burger span:nth-child(1) { top: 15px; }
  .burger span:nth-child(2) { top: 21px; }
  .burger span:nth-child(3) { top: 27px; }
  .burger[aria-expanded="true"] span:nth-child(1) { top: 21px; transform: rotate(45deg); }
  .burger[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
  .burger[aria-expanded="true"] span:nth-child(3) { top: 21px; transform: rotate(-45deg); }

  /* smooth open/close panels (mobile menu + FAQ) */
  .acc { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .32s ease; }
  .acc > div { overflow: hidden; min-height: 0; visibility: hidden; transition: visibility 0s linear .32s; }
  .acc[data-open="true"] { grid-template-rows: 1fr; }
  .acc[data-open="true"] > div { visibility: visible; transition-delay: 0s; }

  /* floating actions */
  .fab-wrap { position: fixed; z-index: 40; display: flex; flex-direction: column; align-items: flex-end; gap: 12px;
    right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  .fab-top { transition: opacity .25s ease, transform .25s ease; }
  .fab-top[data-show="false"] { opacity: 0; transform: translateY(10px); pointer-events: none; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

  var todayISO = function () {

  var normalizePhone = function (v) {

    else if (d.length === 12 && d.indexOf("91") === 0) d = d.slice(2);

  var validate = function (v) {
    var e = {};
    if (!/^[A-Za-z஀-௿\s.'-]{2,}$/.test(v.name.trim())) e.name = "Please enter your full name.";
    if (!v.phone.trim()) e.phone = "Please enter your mobile number.";
    else if (!/^[6-9]\d{9}$/.test(normalizePhone(v.phone))) e.phone = "Enter a valid 10-digit Indian mobile number starting with 6, 7, 8 or 9.";
    if (!v.treatment) e.treatment = "Please select a treatment.";
    if (!v.date) e.date = "Please choose your preferred date.";
    else if (v.date < todayISO()) e.date = "Please choose today or a later date.";
    return e;
  };
  var prettyDate = function (iso) {
    if (!iso) return "";
    var p = iso.split("-");
    var m = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][parseInt(p[1], 10) - 1];
    return parseInt(p[2], 10) + " " + m + " " + p[0];
  };
  var bookingMessage = function (v) {
    var lines = ["Hello " + CONFIG.clinicName + ", I would like to book an appointment."];
    if (v.name.trim()) lines.push("Name: " + v.name.trim());
    if (v.phone.trim()) lines.push("Phone: " + v.phone.trim());
    if (v.treatment) lines.push("Treatment: " + v.treatment);
    if (v.date) lines.push("Preferred date: " + prettyDate(v.date));
    if (v.message.trim()) lines.push("Message: " + v.message.trim());
    return lines.join("\n");
  };

  var INPUT = "w-full rounded-xl border bg-white px-4 py-3 text-base text-ink outline-none transition placeholder:text-ink-soft/60 focus:border-brand focus:ring-4 focus:ring-brand/15 ";

  function Field(props) {
    return html`<div className=${props.className || ""}>
      <label htmlFor=${props.id} className="mb-1.5 block text-sm font-semibold text-ink">${props.label}${props.required && html`<span className="text-[#B42318]" aria-hidden="true"> *</span>`}</label>
      ${props.children}
      ${props.error && html`<p id=${props.id + "-err"} role="alert" className="mt-1.5 text-sm text-[#B42318]">${props.error}</p>`}
    </div>`;
  }

  function Booking(props) {
    var empty = { name: "", phone: "", treatment: "", date: "", message: "" };
    var vs = useState(empty), v = vs[0], setV = vs[1];
    var es = useState({}), err = es[0], setErr = es[1];
    var ds = useState(false), done = ds[0], setDone = ds[1];

    useEffect(function () {
      if (props.preset && props.preset.name) {
        setV(function (s) { return Object.assign({}, s, { treatment: props.preset.name }); });
        setErr(function (s) { return Object.assign({}, s, { treatment: undefined }); });
        setDone(false);
      }
    }, [props.preset]);

    var set = function (k) {
      return function (e) {
        var val = e.target.value;
        setV(function (s) { var n = Object.assign({}, s); n[k] = val; return n; });
        if (err[k]) setErr(function (s) { var n = Object.assign({}, s); n[k] = undefined; return n; });
      };
    };
    var blur = function (k) {
      return function () {
        var all = validate(v);
        setErr(function (s) { var n = Object.assign({}, s); n[k] = all[k]; return n; });
      };
    };
    var submit = function (e) {
      e.preventDefault();
      var all = validate(v);
      setErr(all);
      var first = Object.keys(all)[0];
      if (first) { var el = document.getElementById("bk-" + first); if (el) el.focus(); return; }
      setDone(true);
    };
    var reset = function () { setV(empty); setErr({}); setDone(false); };
    var cls = function (k) { return INPUT + (err[k] ? "border-[#B42318]" : "border-line"); };
    var aria = function (k) { return { "aria-invalid": err[k] ? "true" : "false", "aria-describedby": err[k] ? "bk-" + k + "-err" : undefined }; };

    var points = ["Choose your treatment and a preferred date.", "Send your request here or directly on WhatsApp.", "Mon – Sat 9:00 AM – 8:00 PM, Sun 10:00 AM – 2:00 PM."];

    return html`<section id="booking" className="bg-white py-20 sm:py-24 lg:py-28" aria-labelledby="booking-title">
      <div className="wrap">
        <div className="grid gap-10 rounded-[2rem] border border-line bg-mist p-6 sm:p-10 lg:grid-cols-[.9fr_1.1fr] lg:gap-14 lg:p-14">
          <${Reveal}>
            <div className="min-w-0">
              <p className="text-xs font-semibold uppercase tracking-[.16em] text-brand">Appointments</p>
              <h2 id="booking-title" className="mt-3 font-heading text-3xl font-semibold leading-tight text-ink text-balance sm:text-4xl">Ready to Give Your Smile the Care It Deserves?</h2>
              <p className="mt-5 text-base text-ink-soft sm:text-lg">Don't wait until a small dental problem becomes a bigger one. Schedule your dental appointment today.</p>
              <ul className="mt-7 space-y-3.5">
                ${points.map(function (p) {
                  return html`<li key=${p} className="flex items-start gap-3 text-[15px] text-ink"><span className="mt-0.5 grid h-6 w-6 shrink-0 place-items-center rounded-full bg-brand text-white"><${Icon} name="check" size=${14} sw=${2.5} /></span>${p}</li>`;
                })}
              </ul>
              <a href=${waLink("Hello SmileCare Dental Clinic, I would like to book an appointment.")} target="_blank" rel="noopener noreferrer" className=${BTN.whatsapp + " mt-8"}><${Icon} name="whatsapp" size=${18} /> Contact Us on WhatsApp</a>
            </div>
          <//>
          <${Reveal} delay=${100}>
            <div className="min-w-0 rounded-3xl bg-white p-6 shadow-soft sm:p-8">
              ${done ? html`<div className="text-center" role="status">
                  <span className="mx-auto grid h-16 w-16 place-items-center rounded-full bg-[#E4F6F4] text-teal-dark"><${Icon} name="check" size=${32} sw=${2.25} /></span>
                  <h3 className="mt-5 font-heading text-2xl font-semibold text-ink">Thank you, ${v.name.trim().split(" ")[0]}.</h3>
                  <p className="mt-2 text-ink-soft">Your request is ready. This demo form does not send data anywhere, so tap the button below to share these details with the clinic on WhatsApp.</p>
                  <dl className="mx-auto mt-6 grid max-w-sm gap-2 rounded-2xl bg-mist p-5 text-left text-sm">
                    <div className="flex justify-between gap-4"><dt className="text-ink-soft">Treatment</dt><dd className="text-right font-medium text-ink">${v.treatment}</dd></div>
                    <div className="flex justify-between gap-4"><dt className="text-ink-soft">Preferred date</dt><dd className="text-right font-medium text-ink">${prettyDate(v.date)}</dd></div>
                    <div className="flex justify-between gap-4"><dt className="text-ink-soft">Phone</dt><dd className="text-right font-medium text-ink">${v.phone.trim()}</dd></div>
                  </dl>
                  <div className="mt-6 flex flex-col gap-3 sm:flex-row sm:justify-center">
                    <a href=${waLink(bookingMessage(v))} target="_blank" rel="noopener noreferrer" className=${BTN.whatsapp}><${Icon} name="whatsapp" size=${18} /> Send on WhatsApp</a>
                    <button type="button" onClick=${reset} className=${BTN.secondary}>Book Another Visit</button>
                  </div>
                </div>`
              : html`<form onSubmit=${submit} noValidate=${true} aria-label="Appointment booking form">
                  <div className="grid gap-5 sm:grid-cols-2">
                    <${Field} id="bk-name" label="Full Name" required=${true} error=${err.name}>
                      <input id="bk-name" name="name" type="text" autoComplete="name" placeholder="Your full name" value=${v.name} onChange=${set("name")} onBlur=${blur("name")} className=${cls("name")} ...${aria("name")} />
                    <//>
                    <${Field} id="bk-phone" label="Phone Number" required=${true} error=${err.phone}>
                      <input id="bk-phone" name="phone" type="tel" inputMode="tel" autoComplete="tel" placeholder="98765 43210" value=${v.phone} onChange=${set("phone")} onBlur=${blur("phone")} className=${cls("phone")} ...${aria("phone")} />
                    <//>
                    <${Field} id="bk-treatment" label="Select Treatment" required=${true} error=${err.treatment}>
                      <select id="bk-treatment" name="treatment" value=${v.treatment} onChange=${set("treatment")} onBlur=${blur("treatment")} className=${cls("treatment")} ...${aria("treatment")}>
                        <option value="">Choose a treatment</option>
                        ${SERVICES.map(function (s) { return html`<option key=${s.name} value=${s.name}>${s.name}</option>`; })}
                        <option value="Dental Checkup">Dental Checkup</option>
                        <option value="Not sure, need advice">Not sure, need advice</option>
                      </select>
                    <//>
                    <${Field} id="bk-date" label="Preferred Appointment Date" required=${true} error=${err.date}>
                      <input id="bk-date" name="date" type="date" min=${todayISO()} value=${v.date} onChange=${set("date")} onBlur=${blur("date")} className=${cls("date")} ...${aria("date")} />
                    <//>
                    <${Field} id="bk-message" label="Message" className="sm:col-span-2">
                      <textarea id="bk-message" name="message" rows="4" placeholder="Tell us about your dental concern (optional)" value=${v.message} onChange=${set("message")} className=${INPUT + "border-line resize-y"}></textarea>
                    <//>
                  </div>
                  <div className="mt-6 flex flex-col gap-3 sm:flex-row">
                    <button type="submit" className=${BTN.primary + " sm:flex-1"}>Book My Appointment</button>
                    <a href=${waLink(bookingMessage(v))} target="_blank" rel="noopener noreferrer" className=${BTN.whatsapp + " sm:flex-1"}><${Icon} name="whatsapp" size=${18} /> Book on WhatsApp</a>
                  </div>
                  <p className="mt-4 text-xs text-ink-soft">Fields marked * are required. Indian mobile numbers only (10 digits, with or without +91).</p>
                </form>`}
            </div>
          <//>
        </div>
      </div>
    </section>`;
  }

  function FAQItem(props) {
    var open = props.open;
    return html`<div className=${"rounded-2xl border bg-white transition-colors " + (open ? "border-brand/40 shadow-soft" : "border-line")}>
      <h3>
        <button type="button" id=${"faq-q-" + props.i} aria-expanded=${open} aria-controls=${"faq-a-" + props.i} onClick=${props.onToggle}
          className="flex w-full items-center justify-between gap-4 px-5 py-4 text-left sm:px-6 sm:py-5">
          <span className="font-heading text-base font-medium text-ink sm:text-lg">${props.q}</span>
          <span className=${"grid h-8 w-8 shrink-0 place-items-center rounded-full transition duration-300 " + (open ? "rotate-180 bg-brand text-white" : "bg-mist text-brand")}><${Icon} name="chevron" size=${18} /></span>
        </button>
      </h3>
      <div id=${"faq-a-" + props.i} role="region" aria-labelledby=${"faq-q-" + props.i} className="acc" data-open=${open ? "true" : "false"}>
        <div><p className="px-5 pb-5 text-ink-soft sm:px-6">${props.a}</p></div>
      </div>
    </div>`;
  }

  function FAQ() {
    var s = useState(0), openIdx = s[0], setOpen = s[1];
    return html`<section id="faq" className="bg-white pb-20 sm:pb-24 lg:pb-28" aria-labelledby="faq-title">
      <div className="wrap">
        <${Reveal}>
          <${SectionHead} id="faq-title" eyebrow="FAQ" title="Frequently Asked Questions." />
        <//>
        <div className="mx-auto mt-10 grid max-w-3xl gap-3">
          ${FAQS.map(function (f, i) {
            return html`<${FAQItem} key=${i} i=${i} q=${f.q} a=${f.a} open=${openIdx === i} onToggle=${function () { setOpen(openIdx === i ? -1 : i); }} />`;
          })}
        </div>
        <div className="mx-auto mt-8 flex max-w-3xl flex-col items-center justify-between gap-4 rounded-2xl bg-mist p-6 sm:flex-row">
          <p className="text-center font-medium text-ink sm:text-left">Still have a question? Our team is happy to help.</p>
          <a href=${waLink("Hello SmileCare Dental Clinic, I need some dental assistance.")} target="_blank" rel="noopener noreferrer" className=${BTN.primary}>Get Dental Assistance</a>
        </div>
      </div>
    </section>`;
  }

  function InfoRow(props) {
    return html`<li className="flex items-start gap-4">
      <span className="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-white text-brand shadow-soft"><${Icon} name=${props.icon} size=${20} /></span>
      <div className="min-w-0">
        <p className="text-xs font-semibold uppercase tracking-wider text-ink-soft">${props.label}</p>
        <div className="mt-0.5 break-words font-medium text-ink">${props.children}</div>
      </div>
    </li>`;
  }

  function Contact() {
    return html`<section id="contact" className="bg-mist py-20 sm:py-24 lg:py-28" aria-labelledby="contact-title">
      <div className="wrap grid gap-12 lg:grid-cols-2 lg:gap-16">
        <${Reveal}>
          <div className="min-w-0">
            <p className="text-xs font-semibold uppercase tracking-[.16em] text-brand">Contact</p>
            <h2 id="contact-title" className="mt-3 font-heading text-3xl font-semibold leading-tight text-ink text-balance sm:text-4xl">Let's Make Your Smile Brighter!</h2>
            <p className="mt-5 text-base text-ink-soft sm:text-lg">Have questions or need dental assistance? Contact our team today. We're happy to help.</p>
            <ul className="mt-8 space-y-5">
              <${InfoRow} icon="phone" label="Phone"><a href=${"tel:" + CONFIG.phoneNumber} className="hover:text-brand">${CONFIG.phoneDisplay}</a><//>
              <${InfoRow} icon="whatsapp" label="WhatsApp"><a href=${waLink("")} target="_blank" rel="noopener noreferrer" className="hover:text-brand">${CONFIG.whatsappDisplay}</a><//>
              <${InfoRow} icon="mail" label="Email"><a href=${"mailto:" + CONFIG.email} className="hover:text-brand">${CONFIG.email}</a><//>
              <${InfoRow} icon="pin" label="Address">${CONFIG.address}<//>
              <${InfoRow} icon="clock" label="Opening Hours">
                ${CONFIG.hours.map(function (hr) { return html`<span key=${hr[0]} className="block">${hr[0]}: ${hr[1]}</span>`; })}
              <//>
            </ul>
            <div className="mt-8 flex flex-col gap-3 sm:flex-row sm:flex-wrap">
              <a href=${"tel:" + CONFIG.phoneNumber} className=${BTN.primary}><${Icon} name="phone" size=${18} /> Call Now</a>
              <a href=${waLink("Hello SmileCare Dental Clinic, I need some dental assistance.")} target="_blank" rel="noopener noreferrer" className=${BTN.whatsapp}><${Icon} name="whatsapp" size=${18} /> WhatsApp Us</a>
              <a href=${mapsLink} target="_blank" rel="noopener noreferrer" className=${BTN.secondary}><${Icon} name="navigation" size=${18} /> Get Directions</a>
            </div>
          </div>
        <//>
        <${Reveal} delay=${100}>
          <div className="relative h-[340px] overflow-hidden rounded-[2rem] border border-line shadow-soft sm:h-[440px] lg:h-full lg:min-h-[420px]">
            <${MapArt} />
            <div className="absolute inset-x-4 bottom-4 flex flex-col gap-3 rounded-2xl bg-white p-4 shadow-soft sm:flex-row sm:items-center sm:justify-between">
              <div className="min-w-0">
                <p className="text-sm font-semibold text-ink">Google Maps placeholder</p>
                <p className="text-xs text-ink-soft">Embed your clinic's Google Map here when you publish.</p>
              </div>
              <a href=${mapsLink} target="_blank" rel="noopener noreferrer" className="inline-flex items-center justify-center gap-1.5 rounded-full bg-brand px-4 py-2 text-sm font-semibold text-white transition hover:bg-brand-dark">Open Maps <${Icon} name="arrow" size=${16} /></a>
            </div>
          </div>
        <//>
      </div>
    </section>`;
  }

  function Footer(props) {
    var quick = [["home", "Home"], ["about", "About Us"], ["services", "Services"], ["dentist", "Our Dentist"], ["contact", "Contact Us"]];
    var svc = ["Teeth Cleaning", "Teeth Whitening", "Dental Implants", "Root Canal Treatment", "Braces & Aligners"];
    var footLabel = { "Root Canal Treatment": "Root Canal" };
    var socials = [["facebook", CONFIG.social.facebook, "Facebook"], ["instagram", CONFIG.social.instagram, "Instagram"], ["youtube", CONFIG.social.youtube, "YouTube"]];
    var linkCls = "text-sm text-white/90 transition hover:text-white hover:underline";
    return html`<footer className="bg-ink pt-16 text-white" style=${{ paddingBottom: "calc(2rem + env(safe-area-inset-bottom, 0px))" }}>
      <div className="wrap">
        <div className="grid gap-10 sm:grid-cols-2 lg:grid-cols-[1.4fr_1fr_1fr_1fr]">
          <div className="min-w-0">
            <${Logo} light=${true} />
            <p className="mt-5 max-w-xs text-sm text-white/90">Creating healthy smiles with quality dental care.</p>
            <div className="mt-6 flex gap-3">
              ${socials.map(function (s) {
                return html`<a key=${s[0]} href=${s[1]} target="_blank" rel="noopener noreferrer" aria-label=${"SmileCare on " + s[2]} className="grid h-10 w-10 place-items-center rounded-full bg-white/10 transition hover:bg-white hover:text-ink"><${Icon} name=${s[0]} size=${18} /></a>`;
              })}
            </div>
          </div>
          <nav aria-label="Quick links">
            <h3 className="font-heading text-base font-semibold">Quick Links</h3>
            <ul className="mt-4 space-y-2.5">
              ${quick.map(function (q) {
                return html`<li key=${q[0]}><a href=${"#" + q[0]} onClick=${function (e) { e.preventDefault(); goTo(q[0]); }} className=${linkCls}>${q[1]}</a></li>`;
              })}
            </ul>
          </nav>
          <nav aria-label="Services">
            <h3 className="font-heading text-base font-semibold">Services</h3>
            <ul className="mt-4 space-y-2.5">
              ${svc.map(function (n) {
                return html`<li key=${n}><a href="#booking" onClick=${function (e) { e.preventDefault(); props.onPick(n); }} className=${linkCls}>${footLabel[n] || n}</a></li>`;
              })}
            </ul>
          </nav>
          <div>
            <h3 className="font-heading text-base font-semibold">Visit Us</h3>
            <ul className="mt-4 space-y-2.5 text-sm text-white/90">
              <li>${CONFIG.address}</li>
              <li>${CONFIG.phoneDisplay}</li>
              <li className="break-words">${CONFIG.email}</li>
            </ul>
          </div>
        </div>
        <div className="mt-12 flex flex-col gap-2 border-t border-white/20 pt-6 text-sm text-white/90 sm:flex-row sm:items-center sm:justify-between">
          <p>© ${new Date().getFullYear()} SmileCare Dental Clinic. All rights reserved.</p>
          <p>Demo website: names, reviews and contact details are placeholders.</p>
        </div>
      </div>
    </footer>`;
  }

  function FloatingActions() {
    var s = useState(false), show = s[0], setShow = s[1];
    useEffect(function () {
      var on = function () { setShow(window.scrollY > 600); };
      on();
      window.addEventListener("scroll", on, { passive: true });
      return function () { window.removeEventListener("scroll", on); };
    }, []);
    return html`<div className="fab-wrap">
      <button type="button" aria-label="Back to top" tabIndex=${show ? 0 : -1} aria-hidden=${show ? "false" : "true"} data-show=${show ? "true" : "false"}
        onClick=${function () { window.scrollTo({ top: 0, behavior: reduceMotion() ? "auto" : "smooth" }); }}
        className="fab-top grid h-12 w-12 place-items-center rounded-full border border-line bg-white text-brand shadow-soft transition hover:bg-brand hover:text-white">
        <${Icon} name="up" size=${22} />
      </button>
      <a href=${waLink("Hello SmileCare Dental Clinic, I would like to make an enquiry.")} target="_blank" rel="noopener noreferrer" aria-label="Chat with SmileCare on WhatsApp"
        className="grid h-14 w-14 place-items-center rounded-full bg-[#25D366] text-white shadow-lift transition hover:scale-105">
        <${Icon} name="whatsapp" size=${28} sw=${1.75} />
      </a>
    </div>`;
  }

  /* ------------------------------------------------------------------
     App
  ------------------------------------------------------------------ */
  function App() {
    var as = useState("home"), active = as[0], setActive = as[1];
    var ps = useState(null), preset = ps[0], setPreset = ps[1];

    useEffect(function () {
      if (!("IntersectionObserver" in window)) return;
      var ids = ["home", "about", "services", "why", "dentist", "testimonials", "booking", "faq", "contact"];
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) { if (en.isIntersecting) setActive(en.target.id); });
      }, { rootMargin: "-40% 0px -55% 0px" });
      ids.forEach(function (id) { var el = document.getElementById(id); if (el) io.observe(el); });
      return function () { io.disconnect(); };
    }, []);

    var pick = function (name) { setPreset({ name: name, n: Date.now() }); goTo("booking"); };

    return html`<div>
      <${Navbar} active=${active} />
      <main>
        <${Hero} />
        <${About} />
        <${Services} onPick=${pick} />
        <${WhyUs} />
        <${Dentist} />
        <${Testimonials} />
        <${Booking} preset=${preset} />
        <${FAQ} />
        <${Contact} />
      </main>
      <${Footer} onPick=${pick} />
      <${FloatingActions} />
    </div>`;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>

</body></html>
